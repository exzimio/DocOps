# A interface servida como ficheiros estáticos, e a API no mesmo sítio.
#
# A sessão vive num cookie `HttpOnly`, `SameSite=Lax`. Para o browser o mandar, a interface e a API
# têm de estar na mesma origem: daí o encaminhamento de `/api` e `/health` em vez de a interface
# falar com outro domínio. É a mesma decisão que o proxy do Vite já tomava em desenvolvimento.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão: o pacote da interface é sobretudo JavaScript e CSS, que comprimem muito bem.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ----------------------------------------------------------------------------------
    # Cabeçalhos de segurança da **interface**.
    #
    # Os que a API emite protegem respostas JSON e não chegam aqui: o `SECURITY.md` registava isto
    # como limitação por não haver quem servisse a interface em produção. Passa a haver.
    # ----------------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # `style-src` aceita estilos em linha porque o desenhador de processos posiciona os nós por
    # atributo `style`, calculado a partir das coordenadas guardadas. Tudo o resto é restrito: sem
    # scripts de terceiros, sem iframes, sem formulários para fora, e `connect-src` limitado à
    # própria origem, que é para onde a API é encaminhada.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A verificação de origem da API recusa pedidos cuja origem não reconhece. Reencaminhar o
        # `Origin` tal como veio é o que lhe permite decidir: reescrevê-lo seria a interface a
        # responder por si própria.
        proxy_set_header Origin            $http_origin;

        # Carregamento de documentos: o limite real é o da aplicação (25 MB por omissão); aqui fica
        # com folga para a recusa vir do sítio que sabe explicar porquê.
        client_max_body_size 32m;

        # O cabeçalho da resposta de autenticação não cabe no buffer por omissão (4 KB): o cookie de
        # sessão leva as claims cifradas, e com vários perfis e departamentos passa disso. O nginx
        # responde 502 e regista «upstream sent too big header», o que parece uma avaria da API e
        # não é: a API respondeu bem, quem não conseguiu ler foi o proxy.
        #
        # Nunca apareceria em desenvolvimento, porque o proxy do Vite não tem este limite. É o tipo
        # de defeito que só a configuração implantada mostra.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Os pacotes trazem o resumo no nome e nunca mudam de conteúdo: podem ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicação de página única: qualquer caminho que não seja um ficheiro devolve o `index.html`, e
    # é o encaminhador do browser que decide. Sem isto, recarregar numa rota interna dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
