name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocOpsControlTower.slnx

      - name: Build
        # Warnings are errors: see Directory.Build.props.
        run: dotnet build DocOpsControlTower.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UnitTests/DocOps.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        # Testcontainers starts a throw-away SQL Server; the runner's Docker daemon is used directly.
        run: dotnet test tests/IntegrationTests/DocOps.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Local_Dev_Passw0rd!
          MSSQL_PID: Developer
        ports:
          - 14330:1433
    env:
      # As três identidades, como na implantação. A política de segurança ao nível da linha nega por
      # omissão e a dispensa exige `app_system`: uma corrida como `sa` veria zero linhas, e a suíte
      # falharia por uma razão que não é a que se quer testar.
      ConnectionStrings__DocOpsDatabase: Server=127.0.0.1,14330;Database=DocOpsControlTower;User Id=app_tenant;Password=Qx7_Ci_91!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True
      ConnectionStrings__DocOpsSystem: Server=127.0.0.1,14330;Database=DocOpsControlTower;User Id=app_system;Password=Vb3_Ci_42!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True
      ConnectionStrings__DocOpsMigrator: Server=127.0.0.1,14330;Database=DocOpsControlTower;User Id=docops_migrator;Password=Mg5_Ci_73!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True
      Seed__Enabled: 'true'
      Seed__ApplyMigrations: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Cria a base de dados e as três identidades, como o passo `identities` da implantação. A
      # imagem das ferramentas traz o `sqlcmd`, e `--network host` alcança o porto que o serviço
      # publica no executor.
      - name: Create the three database identities
        run: |
          for try in $(seq 1 30); do
            docker run --rm --network host \
              -v "${{ github.workspace }}/scripts:/scripts:ro" \
              mcr.microsoft.com/mssql-tools:latest \
              /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1,14330 -U sa -P "$MSSQL_SA_PASSWORD" -b \
                -v AppTenantPassword="Qx7_Ci_91!" AppSystemPassword="Vb3_Ci_42!" \
                   MigratorPassword="Mg5_Ci_73!" \
                -i /scripts/create-database-identities.sql && exit 0
            echo "SQL Server ainda não responde; nova tentativa em 5s ($try/30)"
            sleep 5
          done
          exit 1
        env:
          MSSQL_SA_PASSWORD: Local_Dev_Passw0rd!

      - name: Install web dependencies
        run: npm ci
        working-directory: src/Web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run end-to-end tests
        # The Playwright config starts the API and the Vite dev server itself.
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
