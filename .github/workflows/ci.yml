name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocOpsControlTower.slnx

      - name: Build
        # Warnings are errors: see Directory.Build.props.
        run: dotnet build DocOpsControlTower.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UnitTests/DocOps.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        # Testcontainers starts a throw-away SQL Server; the runner's Docker daemon is used directly.
        run: dotnet test tests/IntegrationTests/DocOps.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      Seed__Enabled: 'true'
      Seed__ApplyMigrations: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Palavras-passe geradas em cada corrida, para nenhuma ficar escrita no repositório. O SQL
      # Server arranca num passo, e não como serviço, porque os serviços arrancam antes de qualquer
      # passo e não podem receber valores gerados.
      #
      # As três identidades, como na implantação: a política de segurança ao nível da linha nega por
      # omissão e a dispensa exige `app_system`, e uma corrida como `sa` veria zero linhas.
      - name: Generate the database passwords
        run: |
          for name in MSSQL_SA_PASSWORD DOCOPS_TENANT_PASSWORD DOCOPS_SYSTEM_PASSWORD DOCOPS_MIGRATOR_PASSWORD; do
            value="Ci$(openssl rand -hex 16)aA1!"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start SQL Server
        run: |
          docker run -d --name docops-sqlserver -p 127.0.0.1:14330:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Create the database and the three identities
        run: |
          docker cp scripts/create-database-identities.sql docops-sqlserver:/tmp/
          for try in $(seq 1 30); do
            docker exec docops-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
              -v AppTenantPassword="$DOCOPS_TENANT_PASSWORD" AppSystemPassword="$DOCOPS_SYSTEM_PASSWORD" \
                 MigratorPassword="$DOCOPS_MIGRATOR_PASSWORD" \
              -i /tmp/create-database-identities.sql && break
            [ "$try" = 30 ] && exit 1
            echo "SQL Server ainda não responde; nova tentativa em 5s ($try/30)"
            sleep 5
          done
          base="Server=127.0.0.1,14330;Database=DocOpsControlTower;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True"
          {
            echo "ConnectionStrings__DocOpsDatabase=$base;User Id=app_tenant;Password=$DOCOPS_TENANT_PASSWORD"
            echo "ConnectionStrings__DocOpsSystem=$base;User Id=app_system;Password=$DOCOPS_SYSTEM_PASSWORD"
            echo "ConnectionStrings__DocOpsMigrator=$base;User Id=docops_migrator;Password=$DOCOPS_MIGRATOR_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm ci
        working-directory: src/Web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run end-to-end tests
        # The Playwright config starts the API and the Vite dev server itself.
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
