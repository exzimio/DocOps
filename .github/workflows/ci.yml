name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocOpsControlTower.slnx

      - name: Build
        # Warnings are errors: see Directory.Build.props.
        run: dotnet build DocOpsControlTower.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UnitTests/DocOps.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        # Testcontainers starts a throw-away SQL Server; the runner's Docker daemon is used directly.
        run: dotnet test tests/IntegrationTests/DocOps.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Local_Dev_Passw0rd!
          MSSQL_PID: Developer
        ports:
          - 14330:1433
    env:
      ConnectionStrings__DocOpsDatabase: Server=127.0.0.1,14330;Database=DocOpsControlTower;User Id=sa;Password=Local_Dev_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True
      Seed__Enabled: 'true'
      Seed__ApplyMigrations: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install web dependencies
        run: npm ci
        working-directory: src/Web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run end-to-end tests
        # The Playwright config starts the API and the Vite dev server itself.
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
