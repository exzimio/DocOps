services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docops-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Passw0rd!}"
      MSSQL_PID: "Developer"
    ports:
      # Bound to the loopback interface only: the development database is never exposed on the network.
      # Host port 14330 (not the default 1433) keeps this project from clashing with another local SQL Server.
      - "127.0.0.1:${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - docops-sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  docops-sqldata:
