services:
  sqlserver:
    # Built rather than pulled: the official image ships without full-text search, which the
    # document search relies on (ADR-005). The first build takes a few minutes; later ones are cached.
    build:
      context: ./docker/sql-server
    image: docops-sqlserver-fts:2022
    container_name: docops-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina-a no .env, a partir do .env.example}"
      MSSQL_PID: "Developer"
    ports:
      # Bound to the loopback interface only: the development database is never exposed on the network.
      # Host port 14330 (not the default 1433) keeps this project from clashing with another local SQL Server.
      - "127.0.0.1:${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - docops-sqldata:/var/opt/mssql
    # Saudável só quando todas as bases estão online, e não logo que o servidor responde. Depois de um
    # reinício, o servidor aceita ligações enquanto ainda recupera as bases, e o passo seguinte falha
    # com o erro 904 se correr nesse intervalo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('a recuperar', 16, 1)\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  docops-sqldata:
